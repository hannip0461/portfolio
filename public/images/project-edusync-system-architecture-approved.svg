  <text x="1219" y="274" class="transaction-title">Transaction</text>
  <line x1="1219" y1="292" x2="1445" y2="292" stroke="#c6281b" stroke-width="2"/>

  <circle cx="1234" cy="326" r="13" fill="#c6281b"/>
  <text x="1234" y="331" text-anchor="middle" style="font-size:13px;font-weight:800;fill:#ffffff">1</text>
  <text x="1260" y="322" class="transaction-step">이벤트 원장 기록</text>
  <text x="1260" y="347" class="transaction-detail">learning_events</text>
  <text x="1260" y="366" class="transaction-detail">(source, event_id) 유일 키</text>

  <line x1="1234" y1="339" x2="1234" y2="385" stroke="#c6281b" stroke-width="2"/>
  <circle cx="1234" cy="399" r="13" fill="#c6281b"/>
  <text x="1234" y="404" text-anchor="middle" style="font-size:13px;font-weight:800;fill:#ffffff">2</text>
  <text x="1260" y="395" class="transaction-step">진행 상태 잠금 · 갱신</text>
  <text x="1260" y="420" class="transaction-detail">lecture_progress</text>
  <text x="1260" y="439" class="transaction-detail">key-range lock</text>

  <rect x="1219" y="449" width="226" height="28" fill="#fff1ee"/>
  <text x="1332" y="468" text-anchor="middle" class="eyebrow-red">함께 COMMIT · 함께 ROLLBACK</text>

