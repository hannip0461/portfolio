<svg xmlns="http://www.w3.org/2000/svg" width="1728" height="912" viewBox="0 0 1728 912" role="img" aria-labelledby="title desc">
  <title id="title">EduSync Learning API 시스템 구조</title>
  <desc id="desc">웹과 외부 플레이어의 학습 이벤트를 검증해 이벤트 원장과 진행 상태를 하나의 SQL Server 트랜잭션으로 저장하고, 중복과 충돌 처리 및 보호자와 Classic ASP의 읽기 전용 경계를 분리한 구조</desc>
  <defs>
    <marker id="arrow-red" markerWidth="11" markerHeight="11" refX="9" refY="5.5" orient="auto">
      <path d="M0 0L11 5.5L0 11Z" fill="#c6281b"/>
    </marker>
    <marker id="arrow-navy" markerWidth="11" markerHeight="11" refX="9" refY="5.5" orient="auto">
      <path d="M0 0L11 5.5L0 11Z" fill="#10233f"/>
    </marker>
    <marker id="arrow-gray" markerWidth="11" markerHeight="11" refX="9" refY="5.5" orient="auto">
      <path d="M0 0L11 5.5L0 11Z" fill="#718096"/>
    </marker>
    <style>
      text { font-family: Pretendard, "Malgun Gothic", Arial, sans-serif; fill: #0c1d36; }
      .rail-number { font-size: 31px; font-weight: 800; fill: #c6281b; }
      .rail-title { font-size: 41px; font-weight: 800; letter-spacing: -1.6px; }
      .rail-copy { font-size: 18px; font-weight: 500; fill: #536176; }
      .environment { font-size: 17px; font-weight: 700; fill: #536176; }
      .lane-red { font-size: 21px; font-weight: 800; fill: #c6281b; }
      .lane-gray { font-size: 20px; font-weight: 800; fill: #42526a; }
      .eyebrow { font-size: 12px; font-weight: 800; letter-spacing: .4px; fill: #68778b; }
      .eyebrow-red { font-size: 12px; font-weight: 800; letter-spacing: .4px; fill: #c6281b; }
      .eyebrow-navy { font-size: 12px; font-weight: 800; letter-spacing: .4px; fill: #10233f; }
      .box-title { font-size: 20px; font-weight: 800; }
      .box-detail { font-size: 14px; font-weight: 500; fill: #536176; }
      .box-detail-strong { font-size: 14px; font-weight: 700; fill: #334155; }
      .source-title { font-size: 16px; font-weight: 800; }
      .source-detail { font-size: 12px; font-weight: 500; fill: #536176; }
      .transaction-title { font-size: 26px; font-weight: 800; fill: #c6281b; }
      .transaction-step { font-size: 17px; font-weight: 800; }
      .transaction-detail { font-size: 13px; font-weight: 600; fill: #536176; }
      .result-title { font-size: 16px; font-weight: 800; }
      .result-code { font-size: 13px; font-weight: 800; }
      .legend { font-size: 15px; font-weight: 600; fill: #334155; }
      .node { fill: #ffffff; stroke: #10233f; stroke-width: 1.7; }
      .node-red { fill: #ffffff; stroke: #c6281b; stroke-width: 2.2; }
      .node-read { fill: #f8fbff; stroke: #10233f; stroke-width: 1.6; }
      .line-red { fill: none; stroke: #c6281b; stroke-width: 3.2; marker-end: url(#arrow-red); }
      .line-navy { fill: none; stroke: #10233f; stroke-width: 2.5; marker-end: url(#arrow-navy); }
      .line-dashed { fill: none; stroke: #718096; stroke-width: 2.2; stroke-dasharray: 8 7; marker-end: url(#arrow-gray); }
    </style>
  </defs>

  <rect width="1728" height="912" fill="#ffffff"/>

  <text x="30" y="72" class="rail-number">02</text>
  <text x="82" y="75" class="rail-title">시스템 구조</text>
  <text x="32" y="150" class="rail-copy">학습 이벤트 원장·진행 상태의</text>
  <text x="32" y="183" class="rail-copy">원자적 저장과 조회 경계</text>
  <line x1="302" y1="44" x2="302" y2="860" stroke="#cbd5e1" stroke-width="1.6"/>

  <line x1="338" y1="34" x2="1685" y2="34" stroke="#10233f" stroke-width="3"/>
  <text x="1012" y="77" text-anchor="middle" class="environment">Docker Compose · PHP 8.3 · Slim 4 · SQL Server 2022</text>

  <text x="368" y="130" class="lane-red">학습 이벤트 처리</text>
